# dsh-plugin-gsd bundle patch
#
# Makes `dsh plugin --profile <name> add dsh-plugin-gsd` install as a one-click
# profile layer: pnpm resolves this package, DSH detects the bundle via
# `dsh.bundle.patch`, and this patch inserts one application row into the host
# cordis composition. The row's index.js registers the GSD skill provider and
# mounts the claude-code hooks bridge (configPath/pluginRoot point inside this
# package). No manual dependency or patch edits are needed after install.
- insert:
    - id: gsd
      name: 'dsh-plugin-gsd'
